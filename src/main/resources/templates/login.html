<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<th:block th:replace="~{fragments :: navbar}"></th:block>

<main class="app-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-3">Login</h1>
                        <p class="text-muted mb-4">Sign in to manage your dashboard and bookings.</p>

                        <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
                        <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}"></div>

                        <form method="post" th:action="@{/login}">
                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="password">Password</label>
                                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button class="btn btn-primary" type="submit">Login</button>
                                <a class="btn btn-outline-secondary" th:href="@{/register}">Need an account? Register</a>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a class="link-secondary" th:href="@{/}">Back to home</a>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: footer}"></th:block>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
