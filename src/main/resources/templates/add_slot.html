<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add Slot')}"></head>
<body>
<th:block th:replace="~{fragments :: navbar}"></th:block>

<main class="app-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-2">Add an available slot</h1>
                        <p class="text-muted mb-4">Publish a future time window so learners can book you.</p>

                        <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
                        <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}"></div>

                        <form method="post" th:action="@{/add_slot}">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label" for="date">Date</label>
                                    <input class="form-control" id="date" name="date" type="date" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="startTime">Start time</label>
                                    <input class="form-control" id="startTime" name="startTime" type="time" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="endTime">End time</label>
                                    <input class="form-control" id="endTime" name="endTime" type="time" required>
                                </div>

                                <div class="col-12">
                                    <label class="form-label" for="subject">Subject (optional)</label>
                                    <input class="form-control" id="subject" name="subject" placeholder="e.g., Chemistry">
                                </div>
                            </div>

                            <div class="d-flex flex-wrap gap-2 mt-4">
                                <button class="btn btn-primary" type="submit">Create slot</button>
                                <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Back to dashboard</a>
                                <a class="btn btn-outline-primary" th:href="@{/view_slots}">Browse available slots</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: footer}"></th:block>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
