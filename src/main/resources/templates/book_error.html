<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Booking Error')}"></head>
<body>
<th:block th:replace="~{fragments :: navbar}"></th:block>

<main class="app-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-3">Booking error</h1>

                        <div class="alert alert-danger" role="alert">
                            <div class="fw-semibold mb-1">We couldn’t complete that booking.</div>
                            <div th:text="${message}"></div>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-primary" th:href="@{/view_slots}">Back to available slots</a>
                            <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Dashboard</a>
                            <a class="btn btn-outline-secondary" th:href="@{/}">Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: footer}"></th:block>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
