<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<th:block th:replace="~{fragments :: navbar}"></th:block>

<main class="app-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-3">Create account</h1>
                        <p class="text-muted mb-4">Register to book sessions or publish slots as a tutor.</p>

                        <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

                        <form method="post" th:action="@{/register}">
                            <div class="mb-3">
                                <label class="form-label" for="name">Name</label>
                                <input class="form-control" id="name" name="name" autocomplete="name" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="password">Password</label>
                                <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
                                <div class="form-text">Demo app: passwords are stored as plain text.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button class="btn btn-primary" type="submit">Register</button>
                                <a class="btn btn-outline-secondary" th:href="@{/login}">Already have an account? Login</a>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a class="link-secondary" th:href="@{/}">Back to home</a>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: footer}"></th:block>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
