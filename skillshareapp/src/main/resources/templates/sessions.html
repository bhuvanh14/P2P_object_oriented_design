<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessions - SkillShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="container-custom section-spacing">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Mentorship Sessions</h2>
            <a href="/" class="btn btn-custom-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Home
            </a>
        </div>
        <div th:if="${sessionUser.role == 'STUDENT'}">
        <!-- Create Session Card -->
            <div class="card-custom mb-5">
                <div class="card-body">
                    <h3 class="mb-4">
                        <i class="fas fa-plus-circle me-2 text-primary"></i>
                        Schedule New Session
                    </h3>
                    <form action="/sessions/create" method="post">
                        <div class="row g-3">

                            <!-- MENTOR DROPDOWN -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Select Mentor</label>
                                <select name="mentorId" class="form-control-custom" required>
                                    <option value="">Choose Mentor</option>
                                    <option th:each="m : ${mentors}"
                                            th:value="${m.studentId}"
                                            th:text="${m.firstName + ' ' + m.lastName}">
                                    </option>
                                </select>
                            </div>

                            <!-- SKILL DROPDOWN -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Select Skill</label>
                                <select name="skillId" class="form-control-custom" required>
                                    <option value="">Choose Skill</option>
                                    <option th:each="s : ${skills}"
                                            th:value="${s.skillId}"
                                            th:text="${s.name}">
                                    </option>
                                </select>
                            </div>

                            <!-- TIME -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Schedule Time</label>
                                <input type="datetime-local" name="time" class="form-control-custom" required>
                            </div>

                            <!-- HIDDEN MENTEE -->
                            <input type="hidden" name="menteeId"
                                th:value="${sessionUser.studentId}" />

                            <div class="col-12">
                                <button type="submit" class="btn btn-custom-primary">
                                    Create Session Request
                                </button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- Sessions List -->
        <h3 class="mb-4">
            <i class="fas fa-list me-2 text-primary"></i>
            All Sessions
        </h3>

        <div th:if="${#lists.isEmpty(sessions)}" class="empty-state">
            <i class="fas fa-calendar-times"></i>
            <h3>No sessions yet</h3>
            <p>Create your first mentorship session above to get started.</p>
        </div>

        <div th:if="${!#lists.isEmpty(sessions)}" class="row g-4">
            <div th:each="s : ${sessions}" class="col-12">
                <div class="card-custom session-card">
                    <div class="card-body">
                        <div class="session-header">
                            <h5 class="mb-0">
                                Session #<span th:text="${s.sessionId}"></span>
                            </h5>
                            <span class="badge"
                                th:classappend="
                                    ${s.status.name() == 'PENDING'} ? ' bg-warning' :
                                    (${s.status.name() == 'ACCEPTED'} ? ' bg-success' :
                                    (${s.status.name() == 'REJECTED'} ? ' bg-danger' :
                                    ' bg-primary'))"
                                th:text="${s.status}">
                            </span>
                        </div>

                        <div class="session-details">
                            <div>
                                <i class="fas fa-user-tie text-primary me-2"></i>
                                <strong>Mentor:</strong> <span th:text="${s.mentor.firstName + ' ' + s.mentor.lastName}"></span>
                            </div>
                            <div>
                                <i class="fas fa-user-graduate text-primary me-2"></i>
                                <strong>Mentee:</strong> <span th:text="${s.mentee.firstName + ' ' + s.mentee.lastName}"></span>
                            </div>
                            <div>
                                <i class="fas fa-lightbulb text-primary me-2"></i>
                                <strong>Skill:</strong> <span th:text="${s.skill.name}"></span>
                            </div>
                            <div>
                                <i class="fas fa-clock text-primary me-2"></i>
                                <strong>Time:</strong> <span th:text="${#temporals.format(s.scheduleTime, 'MMM dd, yyyy HH:mm')}"></span>
                            </div>
                        </div>

                        <div class="d-flex gap-2 flex-wrap">

                            <!-- 🔵 ACCEPT / REJECT (MENTOR ONLY) -->
                            <div th:if="${s.status.name() == 'PENDING' 
                                        and s.mentor.studentId == sessionUser.studentId}">

                                <form action="/sessions/respond" method="post" style="display:inline;">
                                    <input type="hidden" name="sessionId" th:value="${s.sessionId}" />

                                    <button name="status" value="ACCEPTED"
                                            class="btn btn-success btn-sm me-2">
                                        ✔ Accept
                                    </button>

                                    <button name="status" value="REJECTED"
                                            class="btn btn-danger btn-sm">
                                        ✖ Reject
                                    </button>
                                </form>

                            </div>


                            <!-- 🟣 COMPLETE (MENTOR ONLY AFTER ACCEPTED) -->
                            <form th:if="${s.status.name() == 'ACCEPTED' 
                                        and s.mentor.studentId == sessionUser.studentId}"
                                th:action="@{'/sessions/complete/' + ${s.sessionId}}"
                                method="post">

                                <button class="btn btn-custom-primary btn-sm">
                                    ✔ Complete
                                </button>
                            </form>


                            <!-- ⭐ FEEDBACK (MENTEE ONLY AFTER COMPLETED) -->
                            <a th:if="${s.status.name() == 'COMPLETED' 
                                        and s.mentee.studentId == sessionUser.studentId 
                                        and !feedbackMap[s.sessionId]}"
                            th:href="@{'/sessions/feedback/' + ${s.sessionId}}"
                            class="btn btn-custom-secondary btn-sm">

                                ⭐ Give Feedback
                            </a>


                            <!-- ✅ DONE -->
                            <span th:if="${feedbackMap[s.sessionId]}"
                                class="text-success fw-semibold">
                                ✔ Done
                            </span>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
