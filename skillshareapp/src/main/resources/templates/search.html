<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Students - SkillShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="container-custom section-spacing">
        <div class="text-center mb-5">
            <h2>
                <i class="fas fa-search me-2 text-primary"></i>
                Find Students
            </h2>
            <p class="text-secondary">Search for students in our community</p>
        </div>

        <!-- Search Form -->
        <div class="card-custom mb-5">
            <div class="card-body">
                <form action="/search" method="get" class="d-flex gap-3">
                    <div class="input-group flex-grow-1">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" name="query" class="form-control-custom border-start-0"
                               placeholder="Search by name..." value="">
                        <button type="submit" class="btn btn-custom-primary">
                            <i class="fas fa-search me-2"></i>Search
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search Results -->
        <h3 class="mb-4">
            <i class="fas fa-users me-2 text-primary"></i>
            Students
        </h3>

        <div th:if="${#lists.isEmpty(list)}" class="empty-state">
            <i class="fas fa-user-friends"></i>
            <h3>No students found</h3>
            <p>Try adjusting your search terms or browse all mentors.</p>
            <a href="/mentors" class="btn btn-custom-primary mt-3">
                <i class="fas fa-users me-2"></i>Browse All Mentors
            </a>
        </div>

        <div th:if="${!#lists.isEmpty(list)}" class="row g-4">
            <div th:each="student : ${list}" class="col-lg-4 col-md-6">
                <div class="card-custom">
                    <div class="card-body text-center">
                        <div class="mentor-avatar mb-3">
                            <i class="fas fa-user"></i>
                        </div>
                        <h5 th:text="${student.firstName + ' ' + student.lastName}"></h5>
                        <p class="text-secondary mb-2" th:text="${student.department}"></p>
                        <div class="text-primary">
                            <i class="fas fa-graduation-cap me-1"></i>
                            Year <span th:text="${student.year}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
